# 仕様書 §9.11・INV-3・INV-11。`cargo deny check licenses bans` で検査する
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { name = "ehttp" },
    { name = "reqwest" },
    { name = "ureq" },
    { name = "hyper" },
    { name = "curl" },
    { name = "isahc" },
    { name = "attohttpc" },
    { name = "tokio" },
]

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
