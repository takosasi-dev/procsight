[package]
name = "procsight-testee"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

# 結合テスト(tests/)は testee を起動して procsight-win を確かめる。CARGO_BIN_EXE_procsight-testee はこの crate でだけ使える
[dev-dependencies]
procsight-core = { version = "0.3.0", path = "../procsight-core" }
procsight-win = { version = "0.3.0", path = "../procsight-win" }
